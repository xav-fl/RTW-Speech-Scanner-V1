[project]
name = "eps"
version = "0.1.0"
description = "Reproducible pipeline for economics-relevant policy statements from government speeches"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "lxml>=5.0",
    "cssselect>=1.2",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mistral = ["mistralai>=1.0"]

[project.scripts]
eps = "eps.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eps = ["reference/*.csv", "reference/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
